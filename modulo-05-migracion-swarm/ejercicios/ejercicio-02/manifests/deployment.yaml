apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/formacion/web-portal:1.0
          ports:
            - containerPort: 80
          env:
            - name: API_URL
              value: http://localhost:3000 # FIX: debe apuntar al Service interno de api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/formacion/orders-api:1.0
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: database
            - name: DB_PORT
              value: "5432"
            # FIX: faltan DB_NAME, DB_USER y DB_PASSWORD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
        - name: database
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: appdb
            - name: POSTGRES_USER
              value: appuser
            - name: POSTGRES_PASSWORD
              value: secret123
          # FIX: falta montar almacenamiento persistente para PostgreSQL
      # FIX: falta definir un volumen respaldado por un PVC
