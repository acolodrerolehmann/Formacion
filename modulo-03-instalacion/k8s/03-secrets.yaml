data:
  JWT_SECRET: bXktc3VwZXItc2VjcmV0LWp3dC1rZXktMjAyNg==   # my-super-secret-jwt-key-2026
  API_KEY: YWJjZDEyMzQtZWY1Ni03ODkwLWdoaWota2xtbg==       # abcd1234-ef56-7890-ghij-klmn
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: border-travel
  labels:
    app: border-travel
    component: cache
type: Opaque
data:
