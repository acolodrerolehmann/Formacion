# ❌ Deployment con configuración HARDCODEADA
# Este es un ANTI-PATRÓN. Las credenciales están visibles en el manifiesto.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-hardcoded
  labels:
    app: api-hardcoded
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-hardcoded
  template:
    metadata:
      labels:
        app: api-hardcoded
    spec:
      containers:
      - name: api
        image: busybox:1.36
        command: ["sh", "-c", "echo 'App running with DB_HOST=$DB_HOST DB_USER=$DB_USER' && sleep 3600"]
        env:
        - name: DB_HOST
          value: "postgres.prod.svc"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "admin"
        - name: DB_PASSWORD
          value: "SuperSecret123!"    # ← ¡CONTRASEÑA EN TEXTO PLANO!
        - name: LOG_LEVEL
          value: "info"
