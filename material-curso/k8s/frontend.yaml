apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: voyager
  labels:
    app: voyager
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voyager
      component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: voyager
        component: frontend
    spec:
      containers:
        - name: frontend
          image: frontend:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: voyager
  labels:
    app: voyager
    component: frontend
spec:
  type: NodePort
  selector:
    app: voyager
    component: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
