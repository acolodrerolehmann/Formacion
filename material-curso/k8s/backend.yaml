apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: voyager
  labels:
    app: voyager
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voyager
      component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: voyager
        component: backend
    spec:
      containers:
        - name: backend
          image: backend:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: voyager
  labels:
    app: voyager
    component: backend
spec:
  type: ClusterIP
  selector:
    app: voyager
    component: backend
  ports:
    - port: 5000
      targetPort: 5000
