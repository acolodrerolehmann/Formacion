kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cilium-cluster
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # HTTP - Ingress Controller
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # HTTPS - Ingress Controller
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
  - role: worker
  - role: worker
        # Cilium replaces kube-proxy too