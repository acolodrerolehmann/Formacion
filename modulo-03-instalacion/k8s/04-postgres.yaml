apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: border-travel
  labels:
    app: border-travel
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: border-travel
      component: database
  template:
    metadata:
      labels:
        app: border-travel
        component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - borderadmin
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - borderadmin
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: postgres-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: border-travel
  labels:
    app: border-travel
    component: database
spec:
  type: ClusterIP
  selector:
    app: border-travel
    component: database
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
