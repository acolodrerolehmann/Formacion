# ✅ Deployment con ConfigMap montado como fichero (volumen)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-configured
  labels:
    app: nginx-configured
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-configured
  template:
    metadata:
      labels:
        app: nginx-configured
    spec:
      containers:
      - name: nginx
        image: quay.io/nginx/nginx-unprivileged:latest
        ports:
        - containerPort: 8888
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config-file