# NodeAffinity preferente: PREFIERE nodos con disk=ssd, pero no es obligatorio
apiVersion: v1
kind: Pod
metadata:
  name: app-ssd-preferred
  labels:
    app: cache
    tier: performance
spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 80
          preference:
            matchExpressions:
              - key: disk
                operator: In
                values:
                  - ssd
  containers:
    - name: app
      image: hashicorp/http-echo:0.2.3
      args: ["-text=Prefiero nodo SSD, pero puedo ir a otro"]
      ports:
        - containerPort: 5678
