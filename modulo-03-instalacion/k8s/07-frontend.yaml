apiVersion: apps/v1
kind: Deployment
metadata:
  name: border-travel-frontend
  namespace: border-travel
  labels:
    app: border-travel
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: border-travel
      component: frontend
  template:
    metadata:
      labels:
        app: border-travel
        component: frontend
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: border-travel
  labels:
    app: border-travel
    component: frontend
spec:
  type: NodePort
  selector:
    app: border-travel
    component: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
