apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-hpa
  namespace: modulo-07-guiado
  labels:
    app: web-hpa
    module: modulo-07
    exercise: guiado
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-hpa
  template:
    metadata:
      labels:
        app: web-hpa
        module: modulo-07
        exercise: guiado
    spec:
      containers:
        - name: php-apache
          image: registry.k8s.io/hpa-example
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-hpa
  namespace: modulo-07-guiado
  labels:
    app: web-hpa
    module: modulo-07
    exercise: guiado
spec:
  selector:
    app: web-hpa
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-hpa
  namespace: modulo-07-guiado
  labels:
    app: web-hpa
    module: modulo-07
    exercise: guiado
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-hpa
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
