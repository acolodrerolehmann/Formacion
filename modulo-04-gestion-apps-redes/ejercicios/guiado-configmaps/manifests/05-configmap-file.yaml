apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config-file
data:
  default.conf: |
    server {
        listen 8888;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
