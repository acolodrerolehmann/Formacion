apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0.0
          args:
            - "-text=backend"
            - "-listen=:8080"
          ports:
            - containerPort: 8080
        - name: toolbox
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
