# IMPORTANTE: En producción, NO guardar secretos en el repositorio.
# Usar herramientas como Sealed Secrets, External Secrets, Vault, o SOPS.
# Estos valores son solo para el entorno de desarrollo del curso.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: border-travel
  labels:
    app: border-travel
    component: database
type: Opaque
# Valores en base64 (echo -n "valor" | base64)
data:
  DB_USER: Ym9yZGVyYWRtaW4=          # borderadmin
  DB_PASSWORD: czNjdXIzLXBhc3N3MHJk   # s3cur3-passw0rd
