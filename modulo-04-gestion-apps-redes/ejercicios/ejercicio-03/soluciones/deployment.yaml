apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  labels:
    app: order-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
    spec:
      containers:
      - name: api
        image: busybox:1.36
        command: ["sh", "-c", "echo 'Order API started on port $APP_PORT, connecting to $DB_HOST:$DB_PORT/$DB_NAME as $DB_USER' && sleep 3600"]
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: order-api-config
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: order-api-credentials
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: order-api-credentials
              key: DB_PASSWORD
