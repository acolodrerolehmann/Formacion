apiVersion: v1
kind: Pod
metadata:
  name: web-con-init
  namespace: modulo-07-guiado
  labels:
    app: init-demo
spec:
  initContainers:
  - name: descargar-config
    image: busybox:1.36
    command: ["sh", "-c", "echo '<h1>Configurado por init container</h1>' > /work-dir/index.html"]
    volumeMounts:
    - name: workdir
      mountPath: /work-dir
  containers:
  - name: web
    image: nginx:1.25-alpine
    ports:
    - containerPort: 80
    volumeMounts:
    - name: workdir
      mountPath: /usr/share/nginx/html
  volumes:
  - name: workdir
    emptyDir: {}
