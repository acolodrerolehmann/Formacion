apiVersion: v1
kind: Pod
metadata:
  name: quota-exceed
  namespace: dev
  labels:
    app: quota-exceed
    module: modulo-06
    exercise: guiado
    environment: dev
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 3600
      resources:
        requests:
          cpu: 250m
          memory: 160Mi
        limits:
          cpu: 250m
          memory: 160Mi
