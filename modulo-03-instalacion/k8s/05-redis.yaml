apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: border-travel
  labels:
    app: border-travel
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: border-travel
      component: cache
  template:
    metadata:
      labels:
        app: border-travel
        component: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_PASSWORD
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: redis-svc
  namespace: border-travel
  labels:
    app: border-travel
    component: cache
spec:
  type: ClusterIP
  selector:
    app: border-travel
    component: cache
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
