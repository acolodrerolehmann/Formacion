apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: border-travel
  labels:
    app: border-travel
    component: config
data:
  # Configuración general de la aplicación
  APP_ENV: "development"
  APP_PORT: "8080"
  APP_LOG_LEVEL: "info"
  APP_NAME: "Border & Travel API"

  # Configuración de base de datos
  DB_HOST: "postgres-svc"
  DB_PORT: "5432"
  DB_NAME: "bordertravel"

  # Configuración de caché
  REDIS_HOST: "redis-svc"
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: border-travel
  labels:
    app: border-travel
    component: proxy
data:
  nginx.conf: |
    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://app-svc:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
